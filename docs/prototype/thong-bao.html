<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikari Cafe — Prototype Thông báo</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1C1B19;--paper:#FAF8F3;--paper-2:#FFFFFF;--matcha:#5F7A4A;--matcha-soft:#EAF0E3;--sun:#F2C94C;--sky:#4A90D9;--chili:#D9534F;--muted:#8A857C;--line:#E7E2D8;--radius:14px;--shadow:0 2px 10px rgba(28,27,25,.06),0 8px 24px rgba(28,27,25,.05);--font:"Be Vietnam Pro",system-ui,sans-serif;--font-script:"Caveat",cursive;}
  *{box-sizing:border-box;} body{margin:0;font-family:var(--font);color:var(--ink);background:#efece5;line-height:1.5;}
  .brand-logo{font-family:var(--font-script);font-weight:700;} .muted{color:var(--muted);}
  .phone{width:390px;max-width:100%;margin:24px auto;background:var(--paper);border:10px solid #171614;border-radius:40px;overflow:hidden;box-shadow:var(--shadow);}
  .phone-notch{height:26px;background:#171614;} .screen{height:760px;max-height:82vh;overflow-y:auto;}
  .head{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;}
  .head .brand-logo{font-size:1.6rem;} .head .sub{color:var(--matcha);font-size:.62rem;letter-spacing:2px;text-transform:lowercase;font-weight:600;}
  .bell{position:relative;font-size:1.5rem;} .badge{position:absolute;top:-4px;right:-6px;background:var(--chili);color:#fff;font-size:.66rem;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 4px;}
  .tabs{display:flex;gap:8px;padding:8px 16px;} .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 16px;font-size:.78rem;} .bar a{color:var(--matcha);font-weight:600;cursor:pointer;}
  .list{padding:4px 16px 16px;}
  .n{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;position:relative;}
  .n.unread{border-left:3px solid var(--matcha);} .n .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;flex:none;}
  .n.promo .ic{background:#fff3d6;} .n.order .ic{background:#e6f0ff;} .n.loyalty .ic{background:var(--matcha-soft);}
  .n .b{flex:1;} .n .t{font-weight:600;font-size:.9rem;} .n .m{font-size:.8rem;color:var(--muted);} .n .d{font-size:.7rem;color:var(--muted);margin-top:4px;}
  .n .dot{position:absolute;top:14px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--matcha);}
  .sim{margin:8px 16px 20px;} .sim button{width:100%;border:1px dashed var(--matcha);background:var(--matcha-soft);color:var(--matcha);border-radius:12px;padding:10px;font:inherit;font-weight:600;cursor:pointer;}
  .disc{text-align:center;font-size:.68rem;color:var(--muted);padding:8px 16px;}
</style>
</head>
<body>
<div class="phone"><div class="phone-notch"></div><div class="screen">
  <div class="head">
    <div><div class="brand-logo">Hikari</div><div class="sub">vegetarian cafe</div></div>
    <div class="bell">🔔<span class="badge" id="badge">0</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="bar"><span class="muted" id="unreadTxt"></span><a onclick="readAll()">Đánh dấu tất cả đã đọc</a></div>
  <div class="list" id="list"></div>
  <div class="sim"><button onclick="incoming()">📲 Mô phỏng nhận thông báo mới (realtime)</button></div>
  <div class="disc">Prototype — realtime qua Socket.IO event <code>notification:new</code> (xem spec 05).</div>
</div></div>

<script>
let filter = "all";
let items = [
  { id:1, type:"promo", ic:"🎉", t:"Giảm 20% món mì thứ 3 hàng tuần", m:"Áp dụng cho tất cả tô ramen & udon. Đặt ngay!", d:"2 giờ trước", read:false },
  { id:2, type:"loyalty", ic:"⭐", t:"Bạn sắp lên hạng Vàng", m:"Chỉ cần thêm 1.140.000đ chi tiêu để nhận ưu đãi hạng Vàng.", d:"Hôm qua", read:false },
  { id:3, type:"order", ic:"🛵", t:"Đơn #H1039 đã giao thành công", m:"Cảm ơn bạn! Bạn nhận được +90 điểm.", d:"Hôm qua", read:true },
  { id:4, type:"promo", ic:"🍵", t:"Món mới: Houjicha Latte", m:"Trà xanh rang Nhật, sữa hạt — 45.000đ. Thử ngay nhé!", d:"3 ngày trước", read:true },
];
const TABS = [["all","Tất cả"],["promo","Khuyến mãi"],["order","Đơn hàng"]];
function renderTabs(){ document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>`<button class="${filter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join(""); }
function setFilter(k){ filter=k; renderTabs(); render(); }
function render(){
  const unread = items.filter(i=>!i.read).length;
  document.getElementById("badge").textContent = unread;
  document.getElementById("badge").style.display = unread? "grid":"none";
  document.getElementById("unreadTxt").textContent = unread? unread+" thông báo chưa đọc" : "Đã đọc hết";
  const view = items.filter(i=> filter==="all" || i.type===filter);
  document.getElementById("list").innerHTML = view.map(i=>`
    <div class="n ${i.type} ${i.read?'':'unread'}" onclick="readOne(${i.id})">
      <div class="ic">${i.ic}</div>
      <div class="b"><div class="t">${i.t}</div><div class="m">${i.m}</div><div class="d">${i.d}</div></div>
      ${i.read?'':'<span class="dot"></span>'}</div>`).join("") || '<p class="muted" style="text-align:center">Chưa có thông báo</p>';
}
function readOne(id){ const i=items.find(x=>x.id===id); if(i) i.read=true; render(); }
function readAll(){ items.forEach(i=>i.read=true); render(); }
let seq = 100;
function incoming(){
  const news = [
    { type:"promo", ic:"⚡", t:"Flash sale 30 phút!", m:"Giảm 15.000đ mọi đơn từ 100.000đ. Nhanh tay!" },
    { type:"loyalty", ic:"🎂", t:"Quà sinh nhật cho bạn", m:"Tặng 1 Matcha Latte trong tuần sinh nhật." },
    { type:"promo", ic:"🥗", t:"Combo trưa healthy", m:"Mì + nước detox chỉ 75.000đ, 11h–14h." },
  ];
  const pick = news[Math.floor((Date.now()/1000)%news.length)];
  items.unshift({ id:++seq, ...pick, d:"Vừa xong", read:false });
  render();
}
renderTabs(); render();
</script>
</body>
</html>
