<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo — Hikari Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../../../packages/design-tokens/tokens.css">
<style>
  /* Panel báo cáo rộng gần hết màn: để cột tự giãn thì mỗi cột thành một khối 150px,
     nhìn như bảng màu chứ không còn ra biểu đồ. Ghim bề rộng cột lại. */
  .bars{gap:18px;justify-content:flex-start}
  .bars .bar{max-width:76px}
</style>
<!-- Khoá xem tài liệu (docs/assets/gate.js). Thẻ style giữ trang ẩn khi JS tắt.
     Đây là rào cản cho người xem tình cờ, KHÔNG phải bảo mật — nội dung vẫn nằm trong file. -->
<style id="hikari-gate">html{visibility:hidden!important}</style>
<script src="../../assets/gate.js"></script>
</head>
<body>
<main id="page">
  <div class="date-range" style="margin-bottom:18px">
    <div class="field"><label for="from">Từ ngày</label><input id="from" type="date"></div>
    <div class="field"><label for="to">Đến ngày</label><input id="to" type="date"></div>
    <button class="btn btn-primary btn-sm" onclick="toast('Mô phỏng: đã lọc lại theo khoảng ngày')">Áp dụng</button>
    <button class="btn btn-ghost btn-sm" onclick="quick(7)">7 ngày</button>
    <button class="btn btn-ghost btn-sm" onclick="quick(30)">30 ngày</button>
  </div>

  <div class="stat-grid" id="kpis"></div>

  <div class="toolbar"><div class="tabs" id="tabs"></div></div>
  <div id="view"></div>
</main>

<script src="../shared/branches.js"></script>
<script src="assets/kit.js"></script>
<script src="assets/data.js"></script>
<script src="assets/shell.js"></script>
<script>
Shell.mount({ page:'bao-cao', title:'Báo cáo', sub:'Doanh thu · món bán chạy · khách hàng',
  actions:`<button class="btn btn-outline btn-sm" onclick="toast('Mô phỏng: xuất Excel báo cáo đang xem')">
             <i class="ti ti-file-spreadsheet"></i> Xuất Excel</button>` })

const TABS = [['revenue','Doanh thu'],['items','Món bán chạy'],['customers','Khách hàng'],['channels','Kênh & thanh toán']]
let tab = 'revenue'

function quick(n){
  const to = new Date(), from = new Date(); from.setDate(to.getDate() - n + 1)
  document.getElementById('from').valueAsDate = from
  document.getElementById('to').valueAsDate = to
  toast(`Mô phỏng: xem ${n} ngày gần nhất`)
}
quick(7)

function renderKpis(){
  const rev = REVENUE_7D.reduce((s,d)=> s+d.revenue, 0)
  const ord = REVENUE_7D.reduce((s,d)=> s+d.orders, 0)
  const best = [...REVENUE_7D].sort((a,b)=> b.revenue - a.revenue)[0]
  const card = (l,v,f) => `<div class="stat-card" style="cursor:default"><div class="label">${l}</div>
    <div class="value">${v}</div><div class="kpi-trend muted" style="margin-top:4px">${f}</div></div>`
  document.getElementById('kpis').innerHTML =
    card('Doanh thu 7 ngày', `<span class="price">${vnd(rev)}</span>`, `<span style="color:var(--ok)">▲ 9%</span> so với tuần trước`) +
    card('Số đơn', ord, `TB ${Math.round(ord/7)} đơn/ngày`) +
    card('Giá trị đơn TB', `<span class="price">${vnd(Math.round(rev/ord))}</span>`, 'gồm phí giao & hộp') +
    card('Ngày cao nhất', best.label, `${vnd(best.revenue)}đ · ${best.orders} đơn`)
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(([k,l]) =>
    `<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('')
}
function setTab(k){ tab = k; renderTabs(); render() }

function render(){
  document.getElementById('view').innerHTML = ({ revenue:vRevenue, items:vItems, customers:vCustomers, channels:vChannels })[tab]()
}

function vRevenue(){
  const max = Math.max(...REVENUE_7D.map(d => d.revenue))
  return `<div class="panel"><h2>Doanh thu theo ngày</h2>
    <div class="bars">${REVENUE_7D.map(d => `<div class="bar" style="height:100%" title="${vnd(d.revenue)}đ">
      <span style="height:${Math.round(d.revenue/max*100)}%"></span><small>${d.label}</small></div>`).join('')}</div>
    <div class="table-scroll"><table class="data wide">
      <thead><tr><th>Ngày</th><th class="right">Doanh thu</th><th class="center">Số đơn</th>
        <th class="right">TB/đơn</th><th>So với ngày trước</th></tr></thead>
      <tbody>${REVENUE_7D.map((d,i) => {
        const prev = i ? REVENUE_7D[i-1].revenue : d.revenue
        const p = pct(d.revenue - prev, prev)
        return `<tr><td>${d.label} · ${dmy(d.d)}</td><td class="right">${money(d.revenue)}</td>
          <td class="center">${d.orders}</td><td class="right">${money(Math.round(d.revenue/d.orders))}</td>
          <td>${i === 0 ? '<span class="muted">—</span>'
            : p >= 0 ? `<span style="color:var(--ok);font-weight:700">▲ ${p}%</span>`
                     : `<span style="color:var(--danger);font-weight:700">▼ ${-p}%</span>`}</td></tr>`
      }).join('')}</tbody></table></div></div>`
}

function vItems(){
  const all = MENU.flatMap(c => c.items.map(i => ({ ...i, cat: c.name })))
    .sort((a,b) => b.sold * b.price - a.sold * a.price)
  const total = all.reduce((s,i) => s + i.sold * i.price, 0)
  return `<div class="panel"><h2>Món bán chạy (theo doanh thu)</h2>
    <div class="table-scroll"><table class="data wide">
      <thead><tr><th style="width:36px">#</th><th>Món</th><th>Nhóm</th><th class="center">Đã bán</th>
        <th class="right">Doanh thu</th><th style="width:150px">Tỷ trọng</th></tr></thead>
      <tbody>${all.map((i,k) => `<tr class="${i.available ? '' : 'blocked'}">
        <td class="center muted">${k+1}</td>
        <td><b>${i.name}</b>${i.available ? '' : ' <span class="tag tag-out">tạm hết</span>'}</td>
        <td class="muted">${i.cat}</td><td class="center">${i.sold}</td>
        <td class="right">${money(i.sold * i.price)}</td>
        <td><div class="progress-bar"><span style="width:${pct(i.sold*i.price, all[0].sold*all[0].price)}%"></span></div>
          <div class="muted" style="font-size:11px;margin-top:3px">${pct(i.sold*i.price, total)}% tổng</div></td>
      </tr>`).join('')}</tbody></table></div>
    <div class="schedule-banner" style="margin-top:14px">
      Ba món đang tắt vì hết hàng vẫn nằm trong bảng — bỏ chúng ra thì tháng sau không ai nhớ
      là mình đã <b>mất doanh thu do hết hàng</b>, chỉ thấy món "bán kém".
    </div></div>`
}

function vCustomers(){
  const top = [...CUSTOMERS].sort((a,b) => b.spent - a.spent)
  const totalSpent = CUSTOMERS.reduce((s,c) => s + c.spent, 0)
  const byTier = ['GOLD','SILVER','MEMBER'].map(t => ({
    t, n: CUSTOMERS.filter(c => c.tier === t).length,
    spent: CUSTOMERS.filter(c => c.tier === t).reduce((s,c) => s + c.spent, 0) }))
  return `<div class="grid-2">
    <div class="panel"><h2>Khách chi tiêu nhiều nhất</h2>
      <div class="table-scroll"><table class="data">
        <thead><tr><th>Khách</th><th>Hạng</th><th class="center">Đơn</th><th class="right">Chi tiêu</th></tr></thead>
        <tbody>${top.map(c => `<tr><td><b>${c.name}</b><div class="muted" style="font-size:11.5px">${c.id}</div></td>
          <td>${badge('tier', c.tier)}</td><td class="center">${c.orders}</td>
          <td class="right">${money(c.spent)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel"><h2>Đóng góp theo hạng</h2>
      ${byTier.map(x => `<div style="margin-bottom:14px">
        <div class="row-flex" style="justify-content:space-between;font-size:13.2px">
          <span>${badge('tier', x.t)} <span class="muted">${x.n} khách</span></span>
          <b>${money(x.spent)}</b></div>
        <div class="progress-bar" style="margin-top:5px"><span style="width:${pct(x.spent, totalSpent)}%"></span></div>
        <div class="muted" style="font-size:11.5px;margin-top:3px">${pct(x.spent, totalSpent)}% doanh thu · ${pct(x.n, CUSTOMERS.length)}% số khách</div>
      </div>`).join('')}
      <div class="schedule-banner">Nhóm Vàng ít người nhưng chiếm phần lớn doanh thu — đây là nhóm
        đáng ưu tiên khi gửi ưu đãi, không phải nhóm đông nhất.</div></div></div>`
}

function vChannels(){
  const g = (key, kind) => {
    const m = {}
    ORDERS.forEach(o => { m[o[key]] = (m[o[key]] || 0) + orderTotal(o) })
    const total = Object.values(m).reduce((s,v) => s+v, 0)
    return Object.entries(m).sort((a,b) => b[1]-a[1]).map(([k,v]) => `
      <div style="margin-bottom:14px">
        <div class="row-flex" style="justify-content:space-between;font-size:13.2px">
          ${badge(kind, k)}<b>${money(v)}</b></div>
        <div class="progress-bar" style="margin-top:5px"><span style="width:${pct(v,total)}%"></span></div>
        <div class="muted" style="font-size:11.5px;margin-top:3px">${pct(v,total)}% doanh thu</div></div>`).join('')
  }
  return `<div class="grid-2">
    <div class="panel"><h2>Theo hình thức nhận hàng</h2>${g('fulfilment','fulfilment')}</div>
    <div class="panel"><h2>Theo cách thanh toán</h2>${g('method','method')}
      <div class="schedule-banner" style="margin-top:6px">
        Tỷ lệ ZaloPay càng cao thì càng ít sai lệch tiền mặt cuối ca — nhưng cũng nghĩa là
        phụ thuộc nhiều hơn vào một cổng: khi ZaloPay lỗi thì phải có đường COD dự phòng ngay tại quầy.</div></div>
  </div>`
}

renderKpis(); renderTabs(); render()
</script>
</body>
</html>
