<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikari Cafe — Prototype Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  /* Brand tokens — đồng bộ với shared/brand.css (inline để prototype tự chạy độc lập) */
  :root{--ink:#1C1B19;--paper:#FAF8F3;--paper-2:#FFFFFF;--matcha:#5F7A4A;--matcha-soft:#EAF0E3;--sun:#F2C94C;--sky:#4A90D9;--chili:#D9534F;--muted:#8A857C;--line:#E7E2D8;--radius:14px;--shadow:0 2px 10px rgba(28,27,25,.06),0 8px 24px rgba(28,27,25,.05);--font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-script:"Caveat","Segoe Script",cursive;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);color:var(--ink);background:#efece5;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .brand-logo{font-family:var(--font-script);font-weight:700;letter-spacing:.3px;}
  .brand-sub{color:var(--matcha);font-weight:600;letter-spacing:2px;text-transform:lowercase;}
  .price{color:var(--ink);font-weight:700;}
  .price::after{content:"đ";font-weight:600;font-size:.78em;margin-left:1px;}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;}
  .tag-spicy{background:#fbe9e8;color:var(--chili);}
  .tag-out{background:#eee;color:var(--muted);}
  .tag-veg{background:var(--matcha-soft);color:var(--matcha);}
  .btn{font-family:inherit;font-weight:600;border:none;border-radius:10px;cursor:pointer;padding:10px 16px;background:var(--ink);color:#fff;}
  .btn:active{transform:translateY(1px);}
  .btn-matcha{background:var(--matcha);}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .muted{color:var(--muted);}
  .phone{width:390px;max-width:100%;margin:24px auto;background:var(--paper);border:10px solid #171614;border-radius:40px;overflow:hidden;box-shadow:var(--shadow);position:relative;}
  .phone-screen{height:760px;max-height:82vh;overflow-y:auto;}
  .phone-notch{height:26px;background:#171614;}

  .app-head { padding: 14px 16px 10px; background: var(--paper); position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); }
  .app-head .brand-logo { font-size: 1.7rem; line-height: 1; }
  .app-head .brand-sub { font-size: .62rem; }
  .app-head .loc { font-size: .74rem; color: var(--muted); margin-top: 2px; }
  .app-head .loc .chg { border: 1px solid var(--line); background: #fff; color: var(--matcha); font: inherit;
    font-size: .68rem; font-weight: 700; border-radius: 999px; padding: 1px 9px; margin-left: 6px; cursor: pointer; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; position: sticky; top: 74px; background: var(--paper); z-index: 4; border-bottom: 1px solid var(--line); }
  .tabs button { white-space: nowrap; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 14px; border-radius: 999px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .list { padding: 12px 16px 120px; }
  .grp-title { font-weight: 700; margin: 18px 2px 8px; font-size: 1.05rem; }
  .grp-sub { color: var(--muted); font-size: .8rem; margin: -4px 2px 10px; }
  .item { display: flex; gap: 12px; padding: 12px; margin-bottom: 10px; }
  .item .body { flex: 1; }
  .item h3 { margin: 0 0 2px; font-size: .96rem; }
  .item .en { color: var(--muted); font-size: .74rem; font-weight: 400; }
  .item .desc { font-size: .8rem; color: var(--muted); margin: 4px 0 6px; }
  .item .tops { font-size: .72rem; color: var(--muted); }
  .item .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .item .price { font-size: 1rem; }
  .add { width: 34px; height: 34px; border-radius: 10px; background: var(--matcha); color: #fff; border: none; font-size: 1.3rem; line-height: 1; cursor: pointer; }
  .item.out { opacity: .55; }
  .item.out .add { background: #cfcabf; cursor: not-allowed; }
  /* wizard */
  .byo-step { margin-bottom: 14px; }
  .byo-step h4 { margin: 0 0 8px; font-size: .9rem; }
  .byo-step h4 span { color: var(--matcha); }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; background: #fff; font-size: .86rem; }
  .opt.sel { border-color: var(--matcha); background: var(--matcha-soft); }
  .opt .r { display: flex; gap: 10px; align-items: center; }
  .opt input { accent-color: var(--matcha); }
  .broth-mode { display: flex; gap: 6px; }
  .broth-mode label { font-size: .72rem; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; cursor: pointer; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
    background: #fff; font-size: 1rem; line-height: 1; cursor: pointer; }
  .stepper b { min-width: 14px; text-align: center; font-size: .9rem; }
  .warn-line { display: none; background: #fbe9e8; color: var(--chili); font-size: .76rem;
    font-weight: 600; border-radius: 8px; padding: 7px 10px; margin: 4px 0 8px; }
  /* sheet */
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; }
  .sheet-bg.open { display: block; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-radius: 20px 20px 0 0; padding: 18px 16px 20px; max-height: 88%; overflow-y: auto; }
  .sheet h3 { margin: 2px 0 12px; }
  /* cart bar */
  .cartbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--ink); color: #fff; padding: 12px 16px; display: none; align-items: center; justify-content: space-between; }
  .cartbar.show { display: flex; }
  .cartbar .n { background: var(--sun); color: var(--ink); border-radius: 999px; padding: 1px 9px; font-weight: 700; font-size: .8rem; }
  .cartbar .price::after { color: #fff; }
  .cartbar .price { color: #fff; }
  /* cart sheet */
  .cline { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
  .cline .cn { flex: 1; }
  .cline .opt-txt { color: var(--muted); font-size: .74rem; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: #fff; font-size: 1rem; cursor: pointer; }
  .modes { display: flex; gap: 6px; margin: 12px 0; }
  .modes button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .modes button.active { background: var(--matcha); color: #fff; border-color: var(--matcha); }
  .sumrow { display: flex; justify-content: space-between; font-size: .86rem; margin: 4px 0; }
  .sumrow.total { font-size: 1rem; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .disclaimer { font-size: .68rem; color: var(--muted); text-align: center; padding: 8px 16px; }
</style>
<!-- Khoá xem tài liệu (docs/assets/gate.js). Thẻ style giữ trang ẩn khi JS tắt.
     Đây là rào cản cho người xem tình cờ, KHÔNG phải bảo mật — nội dung vẫn nằm trong file. -->
<style id="hikari-gate">html{visibility:hidden!important}</style>
<script src="../assets/gate.js"></script>
<script src="shared/branches.js"></script>
<script src="shared/branch-picker.js"></script>
<script src="shared/extras-config.js"></script>
<script src="shared/checkout.js"></script>
</head>
<body>
<div class="phone">
  <div class="phone-notch"></div>
  <div class="phone-screen" id="screen">
    <div class="app-head">
      <div class="brand-logo">Hikari</div>
      <div class="brand-sub">vegetarian cafe</div>
      <div class="loc" id="branchLine"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>

    <div class="cartbar" id="cartbar" onclick="openCart()">
      <span><span class="n" id="cartCount">0</span> món</span>
      <strong>Xem giỏ hàng →</strong>
      <span class="price" id="cartTotal">0</span>
    </div>

    <div class="sheet-bg" id="sheetBg" onclick="closeSheet(event)">
      <div class="sheet" id="sheet" onclick="event.stopPropagation()"></div>
    </div>
  </div>
</div>
<p class="disclaimer">Prototype — dữ liệu từ <code>docs/assets/data/menu.json</code>. Bấm “Tiếp tục đặt hàng” trong giỏ để đi hết luồng đặt → phí giao → thanh toán → theo dõi đơn. Không gọi API/BE/ZaloPay thật.</p>

<script>
/* ==== Dữ liệu menu (rút từ assets/data/menu.json) ==== */
const MENU = [
  { id:"signature-noodles", name:"Mì signature", items:[
    { id:"tamago-ramen", name:"Tamago Ramen", en:"Ramen + nước dùng rau củ, sữa hạt", price:50000, tops:"Trứng lòng đào · đậu hủ · chả chay · nấm kim châm · cải thìa · gừng đỏ", spicy:false, available:true },
    { id:"spicy-tomyum", name:"Spicy Tomyum", en:"Ramen nước Tomyum chua cay", price:53000, tops:"Đậu hủ · chả chay · bông cải · nấm bào ngư", spicy:true, available:true },
    { id:"yaki-udon", name:"Yaki Udon", en:"Udon trộn sốt đặc biệt + soup miso rong biển", price:55000, tops:"Da đậu hủ rim · chả nấm bào ngư · bắp cải · cải thìa", spicy:false, available:true,
      options:{ group:"Chọn sốt trộn", required:true, choices:["Sốt Shoyu (Tương)","Sốt Tomyum"] } },
    { id:"miso-udon", name:"Miso Udon", en:"Udon nước rau củ, ngưu bàng chiên, rong biển", price:55000, tops:"Ngưu bàng chiên · rong biển", spicy:false, available:true },
    { id:"spicy-shoyu-udon", name:"Spicy Shoyu Udon", en:"Udon nước tương Nhật, cay dịu", price:55000, tops:"Da đậu hủ rim · chả nấm bào ngư · bắp cải · cải thìa", spicy:true, available:true },
  ]},
  { id:"coffee", name:"Cà phê", items:[
    { id:"ca-phe-den", name:"Cà phê đen", en:"Black Coffee", price:25000, available:true },
    { id:"ca-phe-sua", name:"Cà phê sữa", en:"Milk Coffee", price:29000, available:true },
    { id:"bac-xiu", name:"Bạc xỉu", en:"White Coffee", price:29000, available:true },
    { id:"ca-phe-muoi-hong", name:"Cà phê muối hồng", en:"Himalaya Salt Coffee", price:29000, available:true },
    { id:"ca-phe-hat-phi", name:"Cà phê hạt phỉ", en:"Hazelnut Coffee", price:39000, available:true },
    { id:"ca-phe-hat-de", name:"Cà phê hạt dẻ", en:"Chestnut Coffee", price:39000, available:true },
  ]},
  { id:"latte", name:"Latte & trà sữa", items:[
    { id:"tra-sua-an-do", name:"Trà sữa Ấn Độ", en:"Masala Chai", price:42000, available:true },
    { id:"matcha-latte", name:"Trà xanh Nhật, sữa hạt", en:"Matcha Latte", price:45000, available:true },
    { id:"genmaicha-latte", name:"Trà xanh gạo lứt, sữa hạt", en:"Genmaicha Latte", price:45000, available:true },
    { id:"houjicha-latte", name:"Trà xanh rang, sữa hạt", en:"Houjicha Latte", price:45000, available:true },
  ]},
  { id:"detox", name:"Nước nhà làm", items:[
    { id:"kombucha", name:"Trà Olong lên men, atiso đỏ", en:"Kombucha Hibiscus", price:39000, available:false },
    { id:"ginger-ale", name:"Soda gừng thảo mộc", en:"Ginger Ale", price:39000, available:false },
    { id:"herbal-cola", name:"Soda cola thảo mộc", en:"Herbal Cola", price:39000, available:true },
    { id:"black-bean", name:"Nước đậu đen, hạt chia, hà thủ ô", en:"Black Bean & Chia", price:20000, available:true },
    { id:"perilla", name:"Nước tía tô đẹp da", en:"Perilla Drink", price:20000, available:true },
    { id:"blood-herbal", name:"Nước thảo mộc bổ huyết", en:"Herbal Drink", price:20000, available:false },
  ]},
];
/* Tô tự chọn — 4 bước */
/* Bảng phần thêm & giá nằm ở shared/extras-config.js — "Tô tự chọn" và topping thêm của
   món cố định dùng CHUNG một bảng, chủ quán sửa giá/giới hạn trong dashboard
   (admin/cai-dat-topping.html). */
const XG = extrasCfg();
const BYO = {
  id:"byo", name:"Tô tự chọn",
  steps:[
    { key:"noodle",  title:"1. Chọn loại mì",          required:true,  choices: extraChoices("noodle") },
    { key:"broth",   title:"2. Chọn nước dùng",        required:true,  broth:true, choices: extraChoices("broth") },
    { key:"topping", title:"3. Chọn topping (nhiều)",  required:false, multi:true, choices: extraChoices("topping") },
    { key:"veg",     title:"4. Chọn rau (nhiều)",      required:false, multi:true, choices: extraChoices("veg") },
  ]
};
/* Món cố định thêm được CẢ 4 nhóm: mì, nước dùng, topping, rau. */
const EXTRAS = XG.groups;
const EXTRA_MAX = XG.limits.maxPerDish;   // trần chung cho một tô (0 = không giới hạn)
const PACKAGING_FEE = 5000;

/* ==== State ==== */
let cart = [];        // { key, name, opt, price, qty }
let mode = "dine";    // dine | takeaway | delivery
const vnd = n => n.toLocaleString("vi-VN");

/* ==== Render tabs + list ==== */
function renderTabs(){
  const t = document.getElementById("tabs");
  const groups = [{id:"signature-noodles",name:"Mì"},{id:"byo",name:"Tô tự chọn"},{id:"coffee",name:"Cà phê"},{id:"latte",name:"Latte & trà"},{id:"detox",name:"Nước nhà làm"}];
  t.innerHTML = groups.map((g,i)=>`<button class="${i===0?'active':''}" onclick="goTab('${g.id}',this)">${g.name}</button>`).join("");
}
function goTab(id,btn){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("grp-"+id)?.scrollIntoView({behavior:"smooth",block:"start"});
}
function renderList(){
  const el = document.getElementById("list");
  let html = "";
  // Mì signature
  const noodles = MENU.find(m=>m.id==="signature-noodles");
  html += group("signature-noodles", noodles.name, "", noodles.items.map(it=>itemCard(it,true)).join(""));
  // Tô tự chọn
  html += group("byo", BYO.name, "'Tự chọn' theo cách của riêng bạn", byoCard());
  // Đồ uống
  ["coffee","latte","detox"].forEach(cid=>{
    const c = MENU.find(m=>m.id===cid);
    html += group(cid, c.name, "", c.items.map(it=>itemCard(it,false)).join(""));
  });
  el.innerHTML = html;
}
function group(id,title,sub,inner){
  return `<div id="grp-${id}"><div class="grp-title">${title}</div>${sub?`<div class="grp-sub">${sub}</div>`:""}${inner}</div>`;
}
function itemCard(it, canExtra){
  const out = !it.available;
  const tags = `${it.spicy?'<span class="tag tag-spicy">🌶️ Cay</span>':''}${out?'<span class="tag tag-out">Tạm hết</span>':''}`;
  return `<div class="card item ${out?'out':''}">
    <div class="body">
      <h3>${it.name} ${tags}</h3>
      <div class="en">${it.en||""}</div>
      ${it.desc?`<div class="desc">${it.desc}</div>`:""}
      ${it.tops?`<div class="tops">+ ${it.tops}</div>`:""}
      ${canExtra&&!out?`<div class="tops" style="color:var(--matcha);font-weight:600">＋ Thêm được topping / rau</div>`:""}
      <div class="foot"><span class="price">${vnd(it.price)}</span>
        <button class="add" ${out?'disabled':`onclick="pick('${it.id}')"`}>+</button></div>
    </div></div>`;
}
function byoCard(){
  return `<div class="card item"><div class="body">
    <h3>Tô tự chọn <span class="tag tag-veg">4 bước</span></h3>
    <div class="desc">Chọn mì → nước dùng → topping → rau. Giá cộng dồn.</div>
    <div class="foot"><span class="muted" style="font-size:.8rem">Từ 25.000đ</span>
      <button class="add" onclick="openByo()">+</button></div>
  </div></div>`;
}

/* ==== Sheet: món cố định — tuỳ chọn bắt buộc + THÊM MÌ / NƯỚC DÙNG / TOPPING / RAU ====
   Món signature đã có sẵn topping trong tô, nhưng khách hay muốn thêm trứng, thêm mì cho no.
   Dùng bộ đếm số lượng (không phải tick có/không) vì "2 trứng" là yêu cầu có thật;
   giới hạn số lượng do chủ quán đặt trong dashboard — chặn ở đây để bếp không nhận
   nổi một tô 30 phần thêm rồi vỡ trận giờ cao điểm. */
let dishBase = 0, dishQty = {};

function pick(id){
  const grp = MENU.find(m => m.items.some(x=>x.id===id));
  const it  = grp && grp.items.find(x=>x.id===id);
  if(!it) return;
  // Chỉ món mì mới thêm được; đồ uống thêm thẳng, đừng bắt qua một bảng chọn trống.
  const canExtra = grp.id === "signature-noodles";
  if(!canExtra && !it.options){
    addToCart({ key:id, name:it.name, opt:"", price:it.price }); toast(); return;
  }
  openDishSheet(it, canExtra);
}

function openDishSheet(it, canExtra){
  const s = document.getElementById("sheet");
  s.innerHTML = `<h3>${it.name}</h3>
    ${it.tops?`<div class="muted" style="font-size:.78rem;margin:-4px 0 10px">Đã có sẵn trong tô: ${it.tops}</div>`:""}
    <div id="dishBody"></div>
    <div id="dishWarn" class="warn-line"></div>
    <div class="sumrow"><span class="muted" id="dishCount"></span><span></span></div>
    <div class="sumrow total"><span>Tạm tính</span><span class="price" id="dishTotal">0</span></div>
    <button class="btn btn-matcha" style="width:100%;margin-top:10px" onclick="confirmDish('${it.id}')">Thêm vào giỏ</button>`;
  dishBase = it.price; dishQty = {};

  let html = `<div class="byo-step"><h4>Món</h4>
    <div class="opt sel"><span class="r">${it.name}</span><span class="price">${vnd(it.price)}</span></div></div>`;
  if(it.options){
    html += `<div class="byo-step"><h4>${it.options.group} <span>*</span></h4>` +
      it.options.choices.map((c,i)=>`<label class="opt ${i===0?'sel':''}">
        <span class="r"><input type="radio" name="dish-opt" value="${c}" ${i===0?'checked':''} onchange="onSauceChange(this)"> ${c}</span>
      </label>`).join("") + `</div>`;
  }
  if(canExtra) html += EXTRAS.map((g,gi)=>extraGroupBlock(g,gi)).join("");
  document.getElementById("dishBody").innerHTML = html;
  recalcDish(); openSheet();
}

function extraGroupBlock(g,gi){
  const lim = [];
  if(g.maxPerItem) lim.push(`tối đa ${g.maxPerItem}/loại`);
  if(g.maxTotal)   lim.push(`tối đa ${g.maxTotal} phần`);
  return `<div class="byo-step">
    <h4>${g.title} <span style="color:var(--muted);font-weight:400">· ${lim.join(" · ") || "không bắt buộc"}</span></h4>
    ${g.choices.map((c,ci)=>`<div class="opt" id="x-${gi}-${ci}">
      <span class="r" style="flex:1;display:block">${c.name}${g.broth?'<div class="muted" style="font-size:.68rem;line-height:1.2">1 chén</div>':''}</span>
      <span class="stepper">
        <span class="price">+${vnd(extraPrice(g,c))}</span>
        <button type="button" onclick="stepExtra(${gi},${ci},-1)">−</button>
        <b id="q-${gi}-${ci}">0</b>
        <button type="button" onclick="stepExtra(${gi},${ci},1)">+</button>
      </span></div>`).join("")}
  </div>`;
}

function onSauceChange(inp){
  const l = inp.closest(".opt");
  l.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  l.classList.add("sel");
}

const groupCount = gi => EXTRAS[gi].choices.reduce((n,_,ci)=>n+(dishQty[gi+":"+ci]||0), 0);
const totalExtras = () => Object.values(dishQty).reduce((a,b)=>a+b, 0);

/** Chặn TẠI CHỖ và nói rõ vì sao — nút xám không lý do làm khách tưởng app hỏng. */
function stepExtra(gi,ci,d){
  const g = EXTRAS[gi], key = gi+":"+ci, cur = dishQty[key]||0, next = cur+d;
  if(next < 0) return;
  if(d > 0){
    if(g.maxPerItem && next > g.maxPerItem)          return dishWarn(`Tối đa ${g.maxPerItem} × ${g.choices[ci].name} cho một tô`);
    if(g.maxTotal   && groupCount(gi)+1 > g.maxTotal) return dishWarn(`${g.title}: tối đa ${g.maxTotal} phần cho một tô`);
    if(EXTRA_MAX    && totalExtras()+1 > EXTRA_MAX)   return dishWarn(`Tối đa ${EXTRA_MAX} phần thêm cho một tô`);
  }
  dishQty[key] = next;
  document.getElementById(`q-${gi}-${ci}`).textContent = next;
  document.getElementById(`x-${gi}-${ci}`).classList.toggle("sel", next>0);
  dishWarn(""); recalcDish();
}
let warnTimer;
function dishWarn(msg){
  const el = document.getElementById("dishWarn"); if(!el) return;
  el.textContent = msg; el.style.display = msg ? "block" : "none";
  clearTimeout(warnTimer); if(msg) warnTimer = setTimeout(()=>dishWarn(""), 2600);
}

/** Phần thêm đang chọn — một nguồn cho cả tính tiền lẫn dòng mô tả trong giỏ,
 *  để hai chỗ không bao giờ lệch nhau. */
function dishExtras(){
  const out = [];
  EXTRAS.forEach((g,gi)=>g.choices.forEach((c,ci)=>{
    const q = dishQty[gi+":"+ci]||0;
    if(q) out.push({ name:c.name, qty:q, price:extraPrice(g,c)*q });
  }));
  return out;
}
function dishTotalCalc(){ return dishBase + dishExtras().reduce((s,x)=>s+x.price, 0); }
function recalcDish(){
  document.getElementById("dishTotal").textContent = vnd(dishTotalCalc());
  const n = totalExtras();
  document.getElementById("dishCount").textContent =
    n ? `${n} phần thêm${EXTRA_MAX?` / tối đa ${EXTRA_MAX}`:""}` : "";
}

function confirmDish(id){
  const it = MENU.flatMap(m=>m.items).find(x=>x.id===id);
  const sauce = document.querySelector('#dishBody input[name="dish-opt"]:checked')?.value || "";
  const extras = dishExtras();
  const parts = [];
  if(sauce) parts.push(sauce);
  if(extras.length) parts.push("+ " + extras.map(x=>x.name + (x.qty>1?` ×${x.qty}`:"")).join(" · "));
  addToCart({
    key: id + ":" + [sauce, ...extras.map(x=>x.name+"x"+x.qty)].join("|"),  // khác phần thêm = khác dòng giỏ
    name: it.name, opt: parts.join(" · "), price: dishTotalCalc()
  });
  closeSheet(); toast();
}

/* ==== Wizard tô tự chọn ==== */
function openByo(){
  const s = document.getElementById("sheet");
  s.innerHTML = `<h3>Tô tự chọn</h3><div id="byoBody"></div>
    <div class="sumrow total"><span>Tạm tính</span><span class="price" id="byoTotal">0</span></div>
    <button class="btn btn-matcha" style="width:100%;margin-top:10px" onclick="confirmByo()">Thêm vào giỏ</button>`;
  const body = document.getElementById("byoBody");
  body.innerHTML = BYO.steps.map((st,si)=>`
    <div class="byo-step"><h4>${st.title} ${st.required?'<span>*</span>':''}</h4>
      ${st.choices.map((c,ci)=>optRow(st,si,ci,c)).join("")}
    </div>`).join("");
  recalcByo(); openSheet();
}
function optRow(st,si,ci,c){
  const type = st.multi ? "checkbox" : "radio";
  const priceTxt = st.broth ? `<span class="broth-mode">
      <label><input type="radio" name="bm-${si}-${ci}" value="serving" checked onchange="recalcByo()"> phần ${vnd(c.serving)}đ</label>
      <label><input type="radio" name="bm-${si}-${ci}" value="bowl" onchange="recalcByo()"> chén ${vnd(c.bowl)}đ</label>
    </span>` : `<span class="price">${vnd(c.price)}</span>`;
  return `<label class="opt">
    <span class="r"><input type="${type}" name="st-${si}" data-si="${si}" data-ci="${ci}" ${(!st.multi&&ci===0)?'checked':''} onchange="onByoChange(this)"> ${c.name}</span>
    ${priceTxt}</label>`;
}
function onByoChange(inp){
  const label = inp.closest(".opt");
  if(inp.type==="radio"){ label.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel")); }
  label.classList.toggle("sel", inp.checked);
  recalcByo();
}
function byoTotalCalc(){
  let total = 0;
  BYO.steps.forEach((st,si)=>{
    document.querySelectorAll(`#byoBody input[data-si="${si}"]:checked`).forEach(inp=>{
      const c = st.choices[inp.dataset.ci];
      if(st.broth){
        const m = document.querySelector(`#byoBody input[name="bm-${si}-${inp.dataset.ci}"]:checked`)?.value || "serving";
        total += m==="bowl" ? c.bowl : c.serving;
      } else total += c.price;
    });
  });
  return total;
}
function recalcByo(){ document.getElementById("byoTotal").textContent = vnd(byoTotalCalc()); }
function confirmByo(){
  // kiểm tra bước bắt buộc
  for(let si=0; si<BYO.steps.length; si++){
    const st = BYO.steps[si];
    if(st.required && !document.querySelector(`#byoBody input[data-si="${si}"]:checked`)){
      alert("Vui lòng chọn: "+st.title); return;
    }
  }
  const picks = [];
  BYO.steps.forEach((st,si)=>{
    document.querySelectorAll(`#byoBody input[data-si="${si}"]:checked`).forEach(inp=>picks.push(st.choices[inp.dataset.ci].name));
  });
  addToCart({ key:"byo:"+Date.now(), name:"Tô tự chọn", opt:picks.join(" · "), price:byoTotalCalc() });
  closeSheet(); toast();
}

/* ==== Giỏ hàng ==== */
function addToCart(line){
  const found = cart.find(c=>c.key===line.key);
  if(found) found.qty++; else cart.push({...line, qty:1});
  renderCartBar();
}
function renderCartBar(){
  const count = cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent = vnd(subtotal());
  document.getElementById("cartbar").classList.toggle("show", count>0);
}
function subtotal(){ return cart.reduce((s,c)=>s+c.price*c.qty,0); }
function packaging(){ return mode==="takeaway" ? PACKAGING_FEE : 0; }
function openCart(){
  const s = document.getElementById("sheet");
  s.innerHTML = `<h3>Giỏ hàng</h3>
    <div class="modes">
      <button class="${mode==='dine'?'active':''}" onclick="setMode('dine')">🍜 Tại quán</button>
      <button class="${mode==='takeaway'?'active':''}" onclick="setMode('takeaway')">🥡 Mang về</button>
      <button class="${mode==='delivery'?'active':''}" onclick="setMode('delivery')">🛵 Giao hàng</button>
    </div>
    <div id="clines">${cart.map(cline).join("") || '<p class="muted">Giỏ trống</p>'}</div>
    <div class="sumrow"><span>Tạm tính</span><span class="price">${vnd(subtotal())}</span></div>
    ${packaging()?`<div class="sumrow"><span>Phụ phí đóng gói (mang về)</span><span class="price">${vnd(packaging())}</span></div>`:""}
    ${mode==='delivery'?`<div class="sumrow muted"><span>Phí giao hàng</span><span>tính ở bước sau *</span></div>`:""}
    <div class="sumrow total"><span>Tổng tạm tính</span><span class="price">${vnd(subtotal()+packaging())}</span></div>
    <button class="btn" style="width:100%;margin-top:12px${cart.length?'':';opacity:.5'}" ${cart.length?'':'disabled'} onclick="startCheckout()">Tiếp tục đặt hàng →</button>
    ${mode==='delivery'?'<p class="disclaimer">* Phí giao hàng do đơn vị giao cung cấp ở bước sau — xem spec 03.</p>':''}`;
  openSheet();
}
function cline(c){
  return `<div class="cline">
    <div class="cn"><div>${c.name}</div>${c.opt?`<div class="opt-txt">${c.opt}</div>`:""}<div class="price" style="font-size:.8rem">${vnd(c.price)}</div></div>
    <div class="qty"><button onclick="chQty('${c.key}',-1)">−</button><span>${c.qty}</span><button onclick="chQty('${c.key}',1)">+</button></div>
  </div>`;
}
function chQty(key,d){
  const c = cart.find(x=>x.key===key); if(!c) return;
  c.qty += d; if(c.qty<=0) cart = cart.filter(x=>x.key!==key);
  renderCartBar(); openCart();
}
function setMode(m){ mode=m; openCart(); }

/* ==== Đặt hàng: bàn giao sang luồng checkout (shared/checkout.js) ==== */
function startCheckout(){
  if(!cart.length){ alert("Giỏ hàng đang trống."); return; }
  closeSheet();
  if(!branch){ BranchPicker.ensure(onBranch); return; }
  Checkout.start({
    lines: cart.map(c=>({ name:c.name, opt:c.opt, price:c.price, qty:c.qty })),
    mode,
    subtotal: subtotal(),
    branch,
    onDone: placed => { if(placed){ cart = []; mode = "dine"; renderCartBar(); } }
  });
}

/* ==== Sheet helpers ==== */
function openSheet(){ document.getElementById("sheetBg").classList.add("open"); }
function closeSheet(e){ if(e&&e.target.id!=="sheetBg"&&e.type==="click") { } document.getElementById("sheetBg").classList.remove("open"); }
function toast(){ const b=document.getElementById("cartbar"); b.style.transition="none"; b.style.opacity=".6"; setTimeout(()=>{b.style.transition="opacity .3s";b.style.opacity="1";},60); }

/* ==== Chi nhánh (spec 09) ====
   Khách phải chọn chi nhánh trước khi xem menu — giờ mở cửa, vùng giao và món còn hàng
   là của từng quán. Đổi chi nhánh giữa chừng thì làm mới giỏ: giỏ thuộc về một quán. */
let branch = null;

function renderBranchLine(){
  document.getElementById("branchLine").innerHTML = branch
    ? `📍 <strong>${branch.name}</strong> · ${branch.open}–${branch.close}
       <button class="chg" onclick="changeBranch()">Đổi</button>`
    : "";
}
function onBranch(b){
  const changed = branch && branch.id !== b.id;
  branch = b;
  if(changed && cart.length){ cart = []; renderCartBar(); }
  renderBranchLine();
}
function changeBranch(){
  if(cart.length && !confirm("Đổi chi nhánh sẽ làm mới giỏ hàng (giỏ thuộc về một quán). Tiếp tục?")) return;
  BranchPicker.open({ onPick: onBranch });
}

/* init */
renderTabs(); renderList(); renderCartBar();
BranchPicker.ensure(onBranch);
</script>
